[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc-lab"
version = "0.1.0"
description = "Local ComEd electricity forecasting and EV charging simulation lab"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
sparc-lab = "sparc_lab.server:main"

[tool.setuptools.package-data]
sparc_lab = ["web/*"]

[tool.setuptools.packages.find]
include = ["sparc_lab*"]
