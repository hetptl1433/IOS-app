name: iOS app

on:
  push:
    paths: ['ios/**', 'controller/**', 'scripts/ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'controller/**', 'scripts/ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    name: Raspberry Pi companion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify provisioning and encrypted transport
        run: |
          python -m pip install -r controller/requirements.txt
          python -m unittest discover -s controller/tests -v

  simulator:
    name: iPhone ${{ matrix.device }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [regular, small]
    env:
      SPARC_SIMULATOR_KIND: ${{ matrix.device }}
      SPARC_TEST_SCOPE: ${{ matrix.device == 'small' && 'ui' || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files
        run: |
          python3 scripts/ios/generate_project.py --check
          python3 scripts/ios/validate_project.py
          xcodebuild -list -project ios/SPARC.xcodeproj
      - name: Build and run unit and UI tests
        run: bash scripts/ios/test.sh
      - name: Keep test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-ios-${{ matrix.device }}-attempt-${{ github.run_attempt }}-test-results
          path: |
            artifacts/ios/
            !artifacts/ios/DerivedData/**
          if-no-files-found: warn
          retention-days: 14
